name: auth0/java-jwt/build-and-test

on:
  workflow_dispatch:

jobs:
  gradle:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          java: 11
          arch: x64
          runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb   # v6.3.0

    - name: Test and Assemble and ApiDiff with Gradle
      run: ./gradlew assemble apiDiff check jacocoTestReport --continue 
        --console=plain

    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        flags: unittests
    - uses: actions/upload-artifact@v7
      with:
        name: Reports
        path: lib/build/reports
