name: auth0/java-jwt/build-and-test

on:
  workflow_dispatch:

jobs:
  gradle:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          java: 11
          arch: arm64
          runner: ubuntu-24.04-arm
          expander_leg: ubuntu-latest-11-arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
          # The build uses Gradle toolchains for JDK 8, 17 and 21 (testJava*, testInJava-*, javadoc)
          # and has no toolchain auto-provisioning, so install them explicitly: not every runner
          # image (e.g. ubuntu-24.04-arm) ships them. The last entry becomes the default JAVA_HOME.
        java-version: |
          8
          17
          21
          ${{ matrix.java }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb   # v6.3.0

    - name: Test and Assemble and ApiDiff with Gradle
      run: ./gradlew assemble apiDiff check jacocoTestReport --continue 
        --console=plain

    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      with:
        flags: unittests
    - uses: actions/upload-artifact@v7
      with:
        name: Reports
        path: lib/build/reports
    name: gradle [${{ matrix.expander_leg }}]
    timeout-minutes: 150
